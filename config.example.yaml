# 钉钉机器人配置示例
# 复制为 config.yaml 后填写真实值（config.yaml 已被 .gitignore 排除，不会入库）

# 模式说明（二选一，webhook 有值时优先走 webhook）：
#   webhook 模式：零权限，群设置→机器人→添加"自定义"机器人获得，actionCard 卡片样式 + @人，无按钮
#   app    模式：需要开发权限/管理员给凭证，可发互动卡片（收到/回复按钮）+ @人
webhook:
  # 群自定义机器人的 Webhook 地址
  webhook_url: ""
  # 添加机器人时设置的加签密钥（SEC 开头），没开启签则留空
  secret: ""

dingtalk:
  # 开放平台企业内部应用凭证
  app_key: ""
  app_secret: ""
  # 应用的 robotCode，一般等于 app_key
  robot_code: ""
  # 目标群的会话 ID（python main.py list-groups 查询）
  open_conversation_id: ""
  # 卡片平台模板编号（不填则用 markdown 兜底，无按钮）
  card_template_id: ""

schedule:
  # daemon 模式的每日推送时间
  push_time: "17:00"

card:
  # 主统计消息里是否逐人列出名单：
  #   false = 只报人数（人名只在第二条 @提醒里出现，推荐）
  #   true  = 未使用/部分已读逐人列出，已全部读完只显示前 5 人
  show_detail_names: false

data:
  # 每日统计表路径
  data_file: "data/当前统计.xlsx"

report:
  # 每日导出报表所在目录（把 BI 导出的 Excel 直接丢进去即可，自动匹配每类最新一份）
  report_dir: "每日报表"
  # 替换为你的省区名称，须与导出表「省区名称」列一致
  province: "示例省区"
  # 末位部门粒度：team（完整班组名）或 area（按 _ 合并的作业区）
  dept_level: "team"
  min_people_improve: 3
  # 总部每周通报的全国参考值（每周更新一次即可；操作工改善率的全国值与排名会自动从改善明细表计算）
  national_weekly:
    as_of: "示例周报周期"
    manager_usage:
      national: 85.00
      province_weekly: 86.00
      province_rank: 10
      total_provinces: 32
      baseline: 80.0
      target: 85.0
    manager_solve:
      national: 68.00
      province_weekly: 72.00
      province_rank: 8
      total_provinces: 32
      baseline: 65.0
      target: 70.0
    operator_improve:
      baseline: 55.0
      target: 60.0
  # 班组负责人映射（可选补充；程序会优先用这里配置的班组/作业区负责人，
  # 未配置时自动从每日报表里的「操作工助手_推送消息汇总」匹配该班组的操作组长，绝不 @中心负责人）
  team_owners: {}
  # 第④块整改要求文案（可按需每日微调）
  rectification_action: "请以上未读人员今日 18:00 前完成中心管理助手全部消息查看（严禁一键已读）；请末位班组负责人今日内组织未改善绩差人员一对一复盘培训，督促改善"
